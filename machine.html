<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>猜数字游戏</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="navbar"></header>
    <section style="text-align: center; margin-top: 50px;">
        <h1>猜数字游戏</h1>
        <p>我已经想好了一个 1-100 之间的数字，你能猜到吗？</p>
        <input type="number" id="guessInput" placeholder="输入你的猜测">
        <button id="guessBtn">提交</button>
        <p id="message"></p>
        <p>尝试次数: <span id="attempts">0</span></p>
    </section>

    <script src="js/nav.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
