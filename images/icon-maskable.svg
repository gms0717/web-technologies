    <linearGradient id="38e1ffgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38e1ff"/><stop offset="1" stop-color="#2a6bd6"/></linearGradient>
    <linearGradient id="ffc46bgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc46b"/><stop offset="1" stop-color="#d4583c"/></linearGradient>
