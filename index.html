<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album Ring · A Dual-Orbit 3D Record Wall</title>
  <meta name="description" content="A dependency-free 3D album wall: two counter-rotating record rings, diagonal image marquees, click-to-play tracks, and your own songs, covers and background — all in plain HTML, CSS and JavaScript.">
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#05060a">
  <link rel="stylesheet" href="css/album.css?v=202611111109">
</head>
<body>
  <!-- 背景双图层，切换时交叉淡入 -->
  <div class="bg-layer" id="bgA"></div>
  <div class="bg-layer is-on" id="bgB"></div>

  <header class="hud">
    <div class="brand">
      <p class="kicker">ALBUM RING</p>
      <h1>Album Ring</h1>
      <p class="hint">Two rings spinning opposite ways · hover to pause · click an album to see its tracks</p>
    </div>

    <div class="bg-switch" id="bgSwitch" role="group" aria-label="Change background">
      <label class="bg-upload" title="Upload your own background">
        <input type="file" id="bgFile" accept="image/*" hidden>
        <span aria-hidden="true">＋</span>
        <span class="sr-only">Upload a background image</span>
      </label>
    </div>
  </header>

  <!-- 斜向图片轮播：左下一列向上滚，右上一列向下滚，压在专辑环下面 -->
  <section class="marquees" aria-hidden="true">
    <div class="marquee marquee--top">
      <div class="marquee-track" id="marqueeTop"></div>
    </div>
    <div class="marquee marquee--bottom">
      <div class="marquee-track" id="marqueeBottom"></div>
    </div>
  </section>

  <button class="marquee-add marquee-add--left" type="button" aria-label="Add a banner" title="Add a banner">＋</button>
  <button class="marquee-add marquee-add--right" type="button" aria-label="Add a banner" title="Add a banner">＋</button>
  <input type="file" id="bannerFile" accept="image/*" hidden>

  <main class="stage">
    <div class="ring ring--outer" id="ringOuter" aria-label="Outer ring albums"></div>
    <div class="ring ring--inner" id="ringInner" aria-label="Inner ring albums"></div>
  </main>

  <!-- 专辑详情：正方形，背景是专辑封面本身，专辑名在左上角 -->
  <section class="album-view" id="albumView" hidden aria-hidden="true">
    <div class="view-backdrop" data-close></div>
    <div class="view-panel" role="dialog" aria-modal="true" aria-labelledby="viewTitle" tabindex="-1">
      <div class="view-bg" id="viewBg" aria-hidden="true"></div>
      <button class="view-close" id="viewClose" type="button" data-close aria-label="Close">✕</button>

      <div class="view-content">
        <h2 class="view-title" id="viewTitle"></h2>
        <p class="view-sub" id="viewSub"></p>
        <div class="view-actions">
          <button class="play-album" id="playAlbum" type="button">▶ Play album</button>
        </div>
        <ul class="track-list" id="trackList"></ul>
      </div>
    </div>
  </section>

  <!-- 底部播放器 -->
  <footer class="player" id="player" hidden>
    <img class="player-cover" id="playerCover" alt="">
    <div class="player-text">
      <p class="player-title" id="playerTitle">—</p>
      <p class="player-sub"><span id="playerSub"></span> <span class="player-tag" id="playerTag">Demo audio</span></p>
    </div>
    <div class="player-controls">
      <button class="ctrl" id="prevBtn" type="button" aria-label="Previous track">⏮</button>
      <button class="ctrl is-main" id="playBtn" type="button" aria-label="Play">▶</button>
      <button class="ctrl" id="nextBtn" type="button" aria-label="Next track">⏭</button>
    </div>
    <div class="player-progress">
      <div class="progress" id="progress" role="slider" aria-label="Playback progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <span id="progressFill"></span>
      </div>
      <div class="progress-time"><span id="curTime">0:00</span><span>/</span><span id="totalTime">0:00</span></div>
    </div>
  </footer>

  <!-- 新增专辑：平时是一颗小圆点，悬停展开成方形，内圈在上、外圈在下 -->
  <div class="fab" id="fab">
    <span class="fab-plus" aria-hidden="true">＋</span>
    <div class="fab-actions">
      <button class="fab-btn" type="button" data-ring="inner" title="New album in the inner ring">Inner</button>
      <button class="fab-btn" type="button" data-ring="outer" title="New album in the outer ring">Outer</button>
    </div>
  </div>

  <script src="js/albums.js?v=202611111109"></script>
  <script src="js/album.js?v=202611111109"></script>
</body>
</html>
