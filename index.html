<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>环绕专辑 · ALBUM RING</title>
  <meta name="description" content="纯前端 3D 专辑墙：内外两圈唱片反向旋转，斜向图片带缓缓流动，点开专辑查看曲目、点歌即播，支持导入本地歌曲与背景。A dependency-free 3D album wall with counter-rotating rings, diagonal marquees and click-to-play tracks.">
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#05060a">
  <link rel="stylesheet" href="css/album.css">
</head>
<body>
  <!-- 背景双图层，切换时交叉淡入 -->
  <div class="bg-layer" id="bgA"></div>
  <div class="bg-layer is-on" id="bgB"></div>

  <header class="hud">
    <div class="brand">
      <p class="kicker">ALBUM RING</p>
      <h1>环绕专辑</h1>
      <p class="hint">内外两圈反向旋转 · 悬停暂停并翻开 · 点击专辑查看曲目</p>
    </div>

    <div class="bg-switch" id="bgSwitch" role="group" aria-label="更换背景">
      <label class="bg-upload" title="上传自己的背景图">
        <input type="file" id="bgFile" accept="image/*" hidden>
        <span aria-hidden="true">＋</span>
        <span class="sr-only">上传背景图</span>
      </label>
    </div>
  </header>

  <!-- 斜向图片轮播：左下一列向上滚，右上一列向下滚，压在专辑环下面 -->
  <section class="marquees" aria-hidden="true">
    <div class="marquee marquee--top">
      <div class="marquee-track" id="marqueeTop"></div>
    </div>
    <div class="marquee marquee--bottom">
      <div class="marquee-track" id="marqueeBottom"></div>
    </div>
  </section>

  <button class="marquee-add marquee-add--left" type="button" aria-label="添加轮播图" title="添加轮播图">＋</button>
  <button class="marquee-add marquee-add--right" type="button" aria-label="添加轮播图" title="添加轮播图">＋</button>
  <input type="file" id="bannerFile" accept="image/*" hidden>

  <main class="stage">
    <div class="ring ring--outer" id="ringOuter" aria-label="外圈专辑"></div>
    <div class="ring ring--inner" id="ringInner" aria-label="内圈专辑"></div>
  </main>

  <!-- 专辑详情：正方形，背景是专辑封面本身，专辑名在左上角 -->
  <section class="album-view" id="albumView" hidden aria-hidden="true">
    <div class="view-backdrop" data-close></div>
    <div class="view-panel" role="dialog" aria-modal="true" aria-labelledby="viewTitle" tabindex="-1">
      <div class="view-bg" id="viewBg" aria-hidden="true"></div>
      <button class="view-close" id="viewClose" type="button" data-close aria-label="关闭">✕</button>

      <div class="view-content">
        <h2 class="view-title" id="viewTitle"></h2>
        <p class="view-sub" id="viewSub"></p>
        <div class="view-actions">
          <button class="play-album" id="playAlbum" type="button">▶ 播放整张</button>
        </div>
        <ul class="track-list" id="trackList"></ul>
      </div>
    </div>
  </section>

  <!-- 底部播放器 -->
  <footer class="player" id="player" hidden>
    <img class="player-cover" id="playerCover" alt="">
    <div class="player-text">
      <p class="player-title" id="playerTitle">—</p>
      <p class="player-sub"><span id="playerSub"></span> <span class="player-tag" id="playerTag">演示音频</span></p>
    </div>
    <div class="player-controls">
      <button class="ctrl" id="prevBtn" type="button" aria-label="上一首">⏮</button>
      <button class="ctrl is-main" id="playBtn" type="button" aria-label="播放">▶</button>
      <button class="ctrl" id="nextBtn" type="button" aria-label="下一首">⏭</button>
    </div>
    <div class="player-progress">
      <div class="progress" id="progress" role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <span id="progressFill"></span>
      </div>
      <div class="progress-time"><span id="curTime">0:00</span><span>/</span><span id="totalTime">0:00</span></div>
    </div>
  </footer>

  <!-- 新增专辑：平时是一颗小圆点，悬停展开成方形，内圈在上、外圈在下 -->
  <div class="fab" id="fab">
    <span class="fab-plus" aria-hidden="true">＋</span>
    <div class="fab-actions">
      <button class="fab-btn" type="button" data-ring="inner" title="新增内圈专辑">内圈</button>
      <button class="fab-btn" type="button" data-ring="outer" title="新增外圈专辑">外圈</button>
    </div>
  </div>

  <script src="js/albums.js"></script>
  <script src="js/album.js"></script>
</body>
</html>
